name: US & KR ETF Swing Signal AI Bot

on:
  # 1) 자동 실행 스케줄 (한국장 마감 후 & 미국장 마감 전후)
  schedule:
    - cron: '40 6 * * 1-5'    # UTC 06:40 = 한국시간(KST) 평일 오후 15:40 (국장 정규장 마감 직후 분석)
    - cron: '50 19 * * 1-5'   # UTC 19:50 = 한국시간(KST) 익일 새벽 04:50 (미국장 마감 10분 전 분석)
    - cron: '10 21 * * 1-5'   # UTC 21:10 = 한국시간(KST) 익일 아침 06:10 (미국장 정규장 마감 직후 분석)

  # 2) 깃허브 웹/모바일에서 언제든 버튼 하나로 즉시 실행 가능
  workflow_dispatch:
    inputs:
      market:
        description: '스캔할 시장 선택 (all: 전체, kr: 국장 11종 챔피언, us: 미국장)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - kr
          - us

permissions:
  contents: write   # 매수/매도 포지션 추적 파일(positions.json, positions_kr.json) 자동 커밋 권한

jobs:
  scan-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ETF Swing Scanner & Send Telegram
        env:
          AI_PROVIDER: ${{ secrets.AI_PROVIDER || 'openrouter' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL || 'https://openrouter.ai/api/v1' }}
          LLM_MODEL: ${{ secrets.LLM_MODEL || 'deepseek/deepseek-chat-v3-0324:free' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET_MARKET="${{ github.event.inputs.market }}"
          elif [ "${{ github.event.schedule }}" = "40 6 * * 1-5" ]; then
            TARGET_MARKET="kr"
          else
            TARGET_MARKET="us"
          fi
          echo "Selected Market: $TARGET_MARKET"
          python main.py --market "$TARGET_MARKET"

      - name: Save updated positions to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f positions.json ] && git add positions.json
          [ -f positions_kr.json ] && git add positions_kr.json
          git diff --staged --quiet || git commit -m "chore: update active swing positions [skip ci]"
          git push
